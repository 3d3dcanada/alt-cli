default_profile = "local"

[profiles.local]
provider = "openai"
endpoint = "http://127.0.0.1:45949/v1"
model = "pc-recorder-protocol-fixture"
context_tokens = 8192
max_turns = 12
uncensored = true

[profiles.local.inference]
version = 1
output_tokens = 2048
action_headroom = 256
llama_extensions = false
output_parameter = "max_tokens"
