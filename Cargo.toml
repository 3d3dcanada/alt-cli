[package]
name = "alt-cli"
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "A local-model terminal workspace with a replaceable ACP engine"
repository = "https://github.com/3d3dcanada/alt-cli"
homepage = "https://github.com/3d3dcanada/alt-cli"
readme = "README.md"
keywords = ["terminal", "tui", "local-llm", "ai", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "alt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cap-std = "4"
similar = "2"
regex = "1"
roxmltree = "0.21"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
portable-pty = "0.9"
vt100 = "0.15"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
flate2 = "1"
tar = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1"

[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[profile.release]
lto = "thin"
strip = true
