name: Complete uncensored model matrix
on:
  workflow_dispatch:
    inputs:
      model:
        description: Explicit uncensored checkpoint to evaluate
        type: choice
        options: [spark, qwen]
        default: spark
        required: true
  push:
    tags: ['eval-*']
permissions:
  contents: read
env:
  MATRIX_MODEL: ${{ inputs.model || 'spark' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare and validate the candidate
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace
          sudo chown "$USER" /workspace
          ln -s "$GITHUB_WORKSPACE" /workspace/alt-cli
          bash scripts/setup-cloud.sh 2>&1 | tee candidate-build.log
          bash scripts/build-portable.sh 2>&1 | tee -a candidate-build.log
          mkdir candidate
          cp target/portable-glibc231/release/alt candidate/alt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-build-log
          path: candidate-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-model-candidate
          path: candidate/alt
  evaluate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: frozen-model-candidate
          path: candidate
      - name: Acquire exact uncensored weights and pinned runtimes
        run: |
          chmod +x candidate/alt
          candidate/alt --data-dir "$RUNNER_TEMP/bootstrap" install engine
          candidate/alt --data-dir "$RUNNER_TEMP/bootstrap" install runtime
          python3 scripts/fetch_evaluation_model.py --model "$MATRIX_MODEL" --directory "$RUNNER_TEMP"
      - name: Run all assigned attempts and retain failed outcomes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/ci_model_shard.py --binary candidate/alt --root "$RUNNER_TEMP" --shard "$SHARD" --output evidence --model "$MATRIX_MODEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uncensored-matrix-${{ matrix.shard }}
          path: evidence/
  report:
    permissions:
      contents: write
    needs: evaluate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: uncensored-matrix-*
          path: collected
      - name: Check every matrix cell and summarize
        run: |
          mkdir -p collected
          python3 scripts/summarize_matrix.py collected --output matrix-summary.json --model "$MATRIX_MODEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-model-matrix
          path: matrix-summary.json
      - name: Preserve the measured evidence in a dedicated results branch
        if: always()
        run: |
          test -f matrix-summary.json
          # Commit evidence on the current default branch so the Actions token
          # is only writing documents, never restoring an older workflow file.
          git fetch origin main:refs/remotes/origin/main
          git switch -c "evidence/model-matrix-$GITHUB_RUN_ID" origin/main
          mkdir -p docs/evidence/v6/remote-matrix/"$MATRIX_MODEL"
          cp -R collected/. docs/evidence/v6/remote-matrix/"$MATRIX_MODEL"/
          cp matrix-summary.json docs/evidence/v6/remote-matrix/"$MATRIX_MODEL"/summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/v6/remote-matrix
          git commit -m "Record complete uncensored model matrix $GITHUB_RUN_ID"
          git push origin HEAD
