name: Frozen matched 7B and 9B qualification
on:
  workflow_dispatch:
    inputs:
      partition:
        description: Final holdout freezes both arms before any result; never tune from it
        type: choice
        options: [development, validation, final-holdout]
        default: development
        required: true
      shards:
        description: Serial workers per job; every job downloads both exact Q4 models
        type: choice
        options: ['4', '16', '32']
        default: '4'
        required: true
      attempts_per_shard:
        description: Explicit budget (600-second cap per attempt); missing slots remain unperformed
        type: number
        default: 2
        required: true
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test exact candidate
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace
          sudo chown "$USER" /workspace
          ln -s "$GITHUB_WORKSPACE" /workspace/alt-cli
          bash scripts/setup-cloud.sh > candidate-build.log 2>&1
          python3 -m unittest discover -s scripts -p test_qualification_campaign.py -v >> candidate-build.log 2>&1
          python3 scripts/acceptance_final.py > oracle-validation.json
      - name: Verify the fixed released baseline before extracting executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir baseline
          gh release download v0.6.0-beta.3 --repo 3d3dcanada/alt-cli --pattern 'alt-0.6.0-linux-x86_64.tar.gz*' --dir baseline
          cd baseline
          echo 'f1c4bc5d4cef9f5e52109c0cbc5d5c77bd81cb0d14fb99e33a1a777e8f12c78e  alt-0.6.0-linux-x86_64.tar.gz' | sha256sum --check
          gh attestation verify alt-0.6.0-linux-x86_64.tar.gz --repo 3d3dcanada/alt-cli --bundle alt-0.6.0-linux-x86_64.tar.gz.sigstore.jsonl --signer-workflow 3d3dcanada/alt-cli/.github/workflows/publish.yml --source-ref refs/tags/v0.6.0-beta.3 --source-digest fa0c8e4130ec4d13c59193436679c4e059c22dee --deny-self-hosted-runners --format json > baseline-verification.json
          tar -xzf alt-0.6.0-linux-x86_64.tar.gz alt-0.6.0-linux-x86_64/alt
      - name: Freeze full attempt plan, exact artifacts and candidate before inspection
        run: |
          set -euo pipefail
          target/debug/alt --data-dir /tmp/alt-qualification-tools install engine
          target/debug/alt --data-dir /tmp/alt-qualification-tools install runtime
          python3 scripts/fetch_evaluation_model.py --model mimo9 --directory /tmp/alt-qualification-models
          python3 scripts/fetch_evaluation_model.py --model josie7 --directory /tmp/alt-qualification-models
          python3 scripts/qualification_campaign.py create --output campaign --baseline baseline/alt-0.6.0-linux-x86_64/alt --engine /tmp/alt-qualification-tools/tools/goose --runtime /tmp/alt-qualification-tools/tools/llama-b11429/llama-server --model-dir /tmp/alt-qualification-models > campaign-plan.log
          python3 scripts/qualification_campaign.py seal --root campaign --candidate target/debug/alt --source-commit "$GITHUB_SHA" > candidate-seal.log
      - name: Declare shard allocation
        id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'PY'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'shard':list(range(int(os.environ['SHARDS'])))})+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-freeze-evidence
          path: |
            candidate-build.log
            oracle-validation.json
            baseline/baseline-verification.json
            campaign-plan.log
            candidate-seal.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-qualification-capsule
          path: campaign/
  evaluate:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.freeze.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sealed-qualification-capsule
          path: campaign
      - name: Acquire only the two declared models and runtimes
        run: |
          set -euo pipefail
          chmod +x campaign/binaries/*
          python3 -m pip install --target /tmp/alt-qualification-python pyte==0.8.2
          campaign/binaries/candidate --data-dir /tmp/alt-qualification-tools install engine
          campaign/binaries/candidate --data-dir /tmp/alt-qualification-tools install runtime
          python3 scripts/fetch_evaluation_model.py --model mimo9 --directory /tmp/alt-qualification-models
          python3 scripts/fetch_evaluation_model.py --model josie7 --directory /tmp/alt-qualification-models
      - name: Execute bounded matched shard without retrying failed attempts
        env:
          PARTITION: ${{ inputs.partition }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shards }}
          ATTEMPTS: ${{ inputs.attempts_per_shard }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: /tmp/alt-qualification-python
        run: |
          python3 campaign/evaluator/qualification_campaign.py run --root campaign --partition "$PARTITION" --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" --max-attempts "$ATTEMPTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-attempts-${{ matrix.shard }}
          path: campaign/attempts/
          include-hidden-files: true
  report:
    needs: [freeze, evaluate]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sealed-qualification-capsule
          path: campaign
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        continue-on-error: true
        with:
          pattern: qualification-attempts-*
          merge-multiple: true
          path: campaign/attempts
      - name: Account for every planned, failed, interrupted and unperformed slot
        run: python3 campaign/evaluator/qualification_campaign.py summary --root campaign --output qualification-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-qualification-accounting
          path: qualification-summary.json
