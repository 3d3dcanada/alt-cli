name: Retain failed CI diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run in this repository to inspect (completed or still running)
        type: string
        required: true
      model_evidence:
        description: Also recover available model evidence artifacts, excluding generated build outputs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Retrieve failed-job output using the repository workflow identity
        run: |
          set -euo pipefail
          [[ "$TARGET_RUN" =~ ^[0-9]+$ ]]
          mkdir diagnostics
          gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,status,conclusion,jobs > diagnostics/run.json
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          root=pathlib.Path('diagnostics')
          result=subprocess.run(['gh','run','view',os.environ['TARGET_RUN'],'--repo',os.environ['GITHUB_REPOSITORY'],'--log-failed'],capture_output=True,text=True)
          # Logs are already secret-masked by Actions. Also remove signed URL
          # queries. A running job may not expose logs yet; still recover its
          # already uploaded artifacts and record the unavailable log status.
          clean=lambda text:re.sub(r'(https?://[^\s?"<>]+)\?[^\s"<>]+',r'\1?[query omitted]',text)
          (root/'failed-jobs.log').write_text(clean(result.stdout))
          (root/'log-retrieval.json').write_text(json.dumps({'exit':result.returncode,'stderr':clean(result.stderr)},indent=2)+'\n')
          PY
      - name: Recover available model evidence without replacing its reported identities
        if: inputs.model_evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path('diagnostics'); rows=[]
          for pattern in ['uncensored-matrix-*','complete-model-matrix']:
              result=subprocess.run(['gh','run','download',os.environ['TARGET_RUN'],'--repo',os.environ['GITHUB_REPOSITORY'],'--pattern',pattern,'--dir',str(root/'model-evidence')],capture_output=True,text=True)
              rows.append({'pattern':pattern,'exit':result.returncode,'error':re.sub(r'https?://\S+','[download URL omitted]',result.stderr)})
          omitted=[]
          for p in sorted((root/'model-evidence').rglob('*')):
              if p.is_file() and ('/independent/target/' in str(p) or '__pycache__' in p.parts):
                  omitted.append({'path':str(p.relative_to(root)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'reason':'Generated compiler/interpreter output; not a declared assertion source'})
                  p.unlink()
          (root/'recovery.json').write_text(json.dumps({'downloads':rows,'omitted_generated_files':omitted,'scope':'Recovered available artifacts. Missing/aborted attempts remain unmeasured; original summaries and identities are not rewritten.'},indent=2)+'\n')
          PY
      - name: Retain diagnostics in a dedicated evidence branch
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git switch -c "evidence/ci-diagnostics-$GITHUB_RUN_ID" origin/main
          destination="docs/evidence/ci-diagnostics/$TARGET_RUN"
          mkdir -p "$destination"
          cp -R diagnostics/. "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m "Retain failed CI diagnostics for $TARGET_RUN"
          git push origin HEAD
