name: Feature request
description: Suggest an improvement with a concrete user workflow.
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Explain the user task and where the current workflow gets in the way.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed behavior
      description: Describe the options, actions or result you would like to see.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How would we know it works?
      description: An example, acceptance check or hardware/model constraint is helpful.
